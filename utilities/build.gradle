/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-library-conventions'
}

dependencies {
    api project(':list')

//dependency added by roostGPT
testImplementation("org.mockito:mockito-core:5.+")
testImplementation("org.mockito:mockito-inline:5.+")
testImplementation("net.bytebuddy:byte-buddy:1.14.+")
testImplementation("net.bytebuddy:byte-buddy-agent:1.14.+")
testImplementation("org.objenesis:objenesis:3.3")
}
repositories { mavenCentral() }
apply plugin : 'jacoco'

test {
  
  jvmArgs += ["-Xshare:off"]

  reports.html.outputLocation = file("$projectDir/testReport");

  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
  }
    
  jacoco {
    enabled = true
    includeNoLocationClasses = false
    sessionId = "<auto-generated value>"
    dumpOnExit = true
    classDumpDir = null
    output = JacocoTaskExtension.Output.FILE
  }

  jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation =  file("$projectDir/coverageReport")
    }
  }
}
